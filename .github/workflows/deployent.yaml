name: Deployment Pipeline1
on: push
jobs:
  first-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: install Dependencies
        run: npm ci
      - name: run Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Deployment
        run: echo "Deployment Done"